server:
  port: 8082

spring:
  application:
    name: nacos-mcp-demo
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP
        register-enabled: true
      config:
        enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/app?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-seed
    baseline-on-migrate: false
  ai:
    mcp:
      server:
        name: ${MCP_SERVER_NAME:mcp-test}
        version: 1.0.0
        type: SYNC
        protocol: sse
        instructions: "用户管理、订单管理、员工岗位查询（Nacos MCP 自动注册）"
        sse-message-endpoint: /mcp/message
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
    alibaba:
      mcp:
        nacos:
          server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
          namespace: ${NACOS_NAMESPACE:public}
          username: ${NACOS_USERNAME:nacos}
          password: ${NACOS_PASSWORD:nacos}
          register:
            enabled: true
            service-name: ${MCP_SERVER_NAME:mcp-test}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.mcp.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.mcp: DEBUG
    com.alibaba.cloud.nacos: INFO
    com.alibaba.cloud.ai.mcp: INFO
