version: '3.8'

services:
  mysql:
    image: mysql:8.0.30
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nacos_devtest
      MYSQL_USER: nacos
      MYSQL_PASSWORD: nacos
    volumes:
      - ./src/main/resources/db/docker:/docker-entrypoint-initdb.d:ro
    networks:
      - mcp-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nacos:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/nacos/nacos-server:v3.1.2
    container_name: nacos-standalone
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8848:8848"
      - "9848:9848"
      - "8080:8080"
    environment:
      MODE: standalone
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos2
      MYSQL_SERVICE_USER: nacos
      MYSQL_SERVICE_PASSWORD: nacos
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=10000&socketTimeout=30000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      MYSQL_DATABASE_NUM: 1
      NACOS_AUTH_TOKEN: SecretKey0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      NACOS_AUTH_ADMIN_ENABLE: "false"
    networks:
      mcp-net:
        aliases:
          - nacos-standalone-mysql
    restart: unless-stopped

  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    command: --requirepass admin1234
    networks:
      - mcp-net
    restart: unless-stopped

  higress:
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/all-in-one:latest
    container_name: higress
    depends_on:
      - nacos
      - redis
    ports:
      - "8001:8001"
      - "8081:8080"
      - "8443:8443"
    volumes:
      - /app/higress:/data
    networks:
      - mcp-net
    restart: unless-stopped

  # Nacos MCP Router：在 Nacos MCP Registry 中搜索、安装并代理其它 MCP Server
  # 文档：https://nacos.io/docs/next/manual/user/ai/nacos-mcp-router/
  nacos-mcp-router:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/nacos/nacos-mcp-router:0.2.2
    container_name: nacos-mcp-router
    depends_on:
      - nacos
    ports:
      - "8000:8000"
    environment:
      NACOS_ADDR: nacos-standalone:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      NACOS_NAMESPACE: public
      TRANSPORT_TYPE: streamable_http
      MODE: router
      PORT: 8000
    networks:
      - mcp-net
    restart: unless-stopped

  # Proxy 模式：将 Nacos 中已注册的 MCP（如 mcp-test）转为 streamableHTTP
  # 启用：docker compose -f docker-compose-infra.yml --profile mcp-proxy up -d
  nacos-mcp-router-proxy:
    profiles:
      - mcp-proxy
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/nacos/nacos-mcp-router:0.2.2
    container_name: nacos-mcp-router-proxy
    depends_on:
      - nacos
    ports:
      - "8002:8000"
    environment:
      NACOS_ADDR: nacos-standalone:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      NACOS_NAMESPACE: public
      TRANSPORT_TYPE: streamable_http
      MODE: proxy
      PROXIED_MCP_NAME: mcp-test
      PORT: 8000
    networks:
      - mcp-net
    restart: unless-stopped

networks:
  mcp-net:
    external: true
