[project]
name = "nacos-mcp-deep-agent"
version = "0.1.0"
description = "Deep Agent demo connecting to Higress MCP via SSE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.10",
    "langgraph>=0.4.0",
    "langchain[mcp]>=1.4.0",
    "langchain-openai>=0.3.0",
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.3.0",
]
